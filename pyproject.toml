[project]
name = "nlpproyect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maitanelizarraga" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fasttext-wheel>=0.9.2",
    "gensim>=4.4.0",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "optuna-dashboard>=0.21.0",
    "pandas>=3.0.6",
    "pip>=26.2.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.16",
    "tensorboard>=2.21.0",
    "tokenizers>=0.20,<1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]

[project.scripts]
nlpproyect = "nlpproyect:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
