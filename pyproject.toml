[project]
name = "nlpproyect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maitanelizarraga" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "optuna-dashboard>=0.21.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
]

[project.scripts]
nlpproyect = "nlpproyect:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
